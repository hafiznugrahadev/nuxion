# ╭──────────────────────────────────────────────────────────────────────────╮
# │ PROD stack — APPLICATIONS ONLY (Dokploy-compatible)                         │
# │   api + web, built from the multi-stage Dockerfiles.                        │
# │   NO postgres / redis here — provision those in Dokploy and inject their │
# │   connection strings as environment variables.                              │
# │                                                                              │
# │   The API is INTERNAL-ONLY (no Traefik router): the web app proxies        │
# │   /api/** and /uploads/** to it over the compose network.                   │
# │                                                                              │
# │   Routing/TLS is handled by Dokploy's Traefik on `dokploy-network`. Set the │
# │   real domain in the Dokploy UI (or uncomment the Traefik labels below).    │
# ╰──────────────────────────────────────────────────────────────────────────╯
name: nuxion

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: nuxion-api:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4400
      # ── Provisioned in Dokploy ──
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-}
      JWT_SECRET: ${JWT_SECRET}
      # Base URL of the frontend (the only public origin) — feeds CORS/CSRF
      # trusted origins, password-reset links and WebAuthn RP defaults.
      APP_URL: ${APP_URL}
      # Local-driver upload URLs point back at the web origin (/uploads proxy).
      STORAGE_PUBLIC_BASE_URL: ${APP_URL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Swagger docs ride the /api proxy (https://<web-domain>/api/docs), Basic
      # Auth-protected; override the password or leave the default in dev.
      SWAGGER_PASSWORD: ${SWAGGER_PASSWORD:-admin}
    expose:
      - '4400' # internal only — reached via the web app's /api proxy
    networks: [dokploy-network]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: nuxion-web:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4300
      HOST: 0.0.0.0
      # API root for the /api & /uploads Nitro proxies (compose service DNS).
      NUXT_API_INTERNAL_BASE: http://api:4400
      # Canonical site URL for @nuxtjs/seo (sitemap/robots/canonical/OG). Read
      # at RUNTIME by nuxt-site-config, so the Dokploy domain can change
      # without a rebuild.
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost:4300}
    expose:
      - '4300'
    depends_on:
      - api
    networks: [dokploy-network]
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # - traefik.http.routers.nuxion-web.rule=Host(`app.example.com`)
      # - traefik.http.routers.nuxion-web.entrypoints=websecure
      # - traefik.http.routers.nuxion-web.tls.certresolver=letsencrypt
      # - traefik.http.services.nuxion-web.loadbalancer.server.port=4300

networks:
  dokploy-network:
    external: true
