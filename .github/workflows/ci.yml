name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# The verify job only needs to read the repo; an explicit floor keeps the
# default (potentially read-write) token out of reach.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes / PR updates).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    # Placeholder URL: no CI step connects to a DB; it only satisfies Prisma's
    # config/generate. Real connection strings are injected at deploy time.
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
    steps:
      # SHAs match dependabot-lockfile.yml: tags are movable, and this repo's
      # policy (see the lockfile workflow) is to pin actions by commit.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Prereqs the gates depend on: Prisma client + the shared-types build.
      - name: Generate Prisma client
        run: bun run --filter @nuxion/api prisma:generate

      - name: Build shared-types
        run: bun run --filter @nuxion/shared-types build

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
